apiVersion: apps/v1
kind: Deployment
metadata:
  name: exam-architect-deployment
  labels:
    app: exam-architect-ai
spec:
  replicas: 2
  selector:
    matchLabels:
      app: exam-architect-ai
  template:
    metadata:
      labels:
        app: exam-architect-ai
    spec:
      containers:
        - name: exam-architect-ai
          image: exam-architect-ai:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: exam-architect-secrets
                  key: GEMINI_API_KEY
                  optional: true
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: exam-architect-service
  labels:
    app: exam-architect-ai
spec:
  type: ClusterIP
  selector:
    app: exam-architect-ai
  ports:
    - name: http
      port: 80
      targetPort: 3000
